<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 3 - Validasi Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 40px;
        display: flex;
        justify-content: center;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }
      h2 {
        text-align: center;
        font-size: 18px;
        margin-bottom: 20px;
      }
      label {
        font-size: 12px;
        margin-bottom: 4px;
        display: block;
        margin-top: 10px;
        color: #555;
      }
      input[type="text"],
      input[type="password"],
      select,
      textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      textarea {
        resize: vertical;
        height: 60px;
      }
      .checkbox-container {
        display: flex;
        align-items: center;
        margin-top: 15px;
        font-size: 12px;
      }
      .checkbox-container input {
        width: auto;
        margin-right: 8px;
      }
      .btn-group {
        margin-top: 20px;
      }
      button {
        padding: 8px 15px;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      .btn-send {
        background-color: #007bff;
      }
      .btn-reset {
        background-color: #007bff;
        margin-left: 5px;
      }
      .err {
        color: red;
        font-size: 11px;
        margin-top: 3px;
        min-height: 14px;
      }
      .ok {
        color: green;
        font-size: 14px;
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>REGISTRATION FORM</h2>
      <form id="reg">
        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter your full name" />
        <div class="err" id="e1"></div>

        <label>Address:</label>
        <input type="text" id="addr" placeholder="Enter your address" />
        <div class="err" id="e2"></div>

        <label>E-mail Address:</label>
        <input type="text" id="mail" placeholder="Enter your email" />
        <div class="err" id="e3"></div>

        <label>Password:</label>
        <input type="password" id="pass" />
        <div class="err" id="e4"></div>

        <label>Select Your Course:</label>
        <select id="course">
          <option value="">Select Course</option>
          <option value="IT">Information Technology</option>
          <option value="CS">Computer Science</option>
        </select>
        <div class="err" id="e5"></div>

        <label>College Name:</label>
        <textarea id="college"></textarea>
        <div class="err" id="e6"></div>

        <div class="checkbox-container">
          <input type="checkbox" id="agree" />
          <label for="agree" style="margin: 0"
            >I agree to the above information</label
          >
        </div>
        <div class="err" id="e7"></div>

        <div class="btn-group">
          <button type="submit" class="btn-send">Send</button>
          <button
            type="reset"
            class="btn-reset"
            onclick="
              document.getElementById('okreg').textContent = '';
              document
                .querySelectorAll('.err')
                .forEach((e) => (e.textContent = ''));
            "
          >
            Reset
          </button>
        </div>
        <div class="ok" id="okreg"></div>
      </form>
    </div>
    <script src="latihan3-validasi-form.js"></script>
  </body>
</html>
