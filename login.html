<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Masuk - Ruang Belajar</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid vh-100 p-0">
      <div class="row g-0 h-100">
        <div class="col-lg-6 d-none d-lg-block split-image position-relative">
          <div
            class="overlay w-100 h-100 bg-indigo opacity-50 position-absolute"
          ></div>
          <div
            class="position-absolute top-50 start-50 translate-middle text-center text-white z-1 w-75"
          >
            <h1 class="fw-bold display-5">Mari Mulai Belajar!</h1>
            <p class="lead">Masuk untuk melanjutkan proses belajarmu.</p>
          </div>
        </div>

        <div
          class="col-lg-6 d-flex justify-content-center align-items-center bg-light"
        >
          <div class="w-100 p-4 p-md-5" style="max-width: 450px">
            <div class="text-center mb-4">
              <h2 class="fw-bold text-indigo">Masuk Akun</h2>
              <p class="text-muted">Masukkan email dan password Anda</p>
            </div>

            <div class="alert alert-success d-none" id="loginSuccess">
              Login berhasil disimulasikan!
            </div>

            <form id="formLogin" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control form-control-lg rounded-3"
                  id="loginEmail"
                  required
                />
                <div class="invalid-feedback">
                  Masukkan format email yang benar.
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <input
                    type="password"
                    class="form-control form-control-lg rounded-start-3"
                    id="loginPass"
                    minlength="8"
                    required
                  />
                  <button
                    class="btn btn-outline-secondary btn-show-pass"
                    type="button"
                  >
                    Lihat
                  </button>
                  <div class="invalid-feedback">
                    Password minimal 8 karakter dan tidak boleh hanya spasi.
                  </div>
                </div>
              </div>
              <button
                class="btn btn-indigo text-white btn-lg w-100 rounded-pill mb-3"
                type="submit"
              >
                Masuk
              </button>
              <p class="text-center text-muted">
                Belum punya akun?
                <a
                  href="register.html"
                  class="text-indigo text-decoration-none fw-bold"
                  >Daftar sekarang</a
                >
              </p>
              <div class="text-center mt-3">
                <a
                  href="index.html"
                  class="text-secondary text-decoration-none small"
                  >← Kembali ke Beranda</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
