<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 2 - Pencarian Kode Pos</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 40px;
        display: flex;
        justify-content: center;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }
      h2 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
      }
      label {
        font-size: 14px;
        margin-bottom: 5px;
        display: block;
        margin-top: 15px;
      }
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        background-color: white;
      }
      select:disabled {
        background-color: #e9ecef;
      }
      button {
        margin-top: 20px;
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        color: white;
        cursor: pointer;
        font-size: 14px;
        background-color: #007bff;
      }
      button:hover {
        opacity: 0.9;
      }
      .note {
        font-size: 12px;
        color: #888;
        margin-top: 20px;
      }
      .hasil {
        margin-top: 15px;
        font-size: 15px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>PENCARIAN KODE POS</h2>

      <label>Provinsi:</label>
      <select id="prov">
        <option value="">Pilih Provinsi</option>
      </select>

      <label>Kabupaten / Kota:</label>
      <select id="kota" disabled>
        <option value="">Pilih Kabupaten / Kota</option>
      </select>

      <label>Kecamatan:</label>
      <select id="kec" disabled>
        <option value="">Pilih Kecamatan</option>
      </select>

      <button id="cari">Cari</button>
      <div class="hasil" id="hasil"></div>
      <div class="note">*Data contoh (sebagian daerah) untuk latihan.</div>
    </div>
    <script src="latihan2-kode-pos.js"></script>
  </body>
</html>
