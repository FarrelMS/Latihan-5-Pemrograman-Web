<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latihan 4 - Dropdown Dinamis</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 40px;
        display: flex;
        justify-content: center;
      }
      .card {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }
      h2 {
        text-align: center;
        font-size: 22px;
        margin-bottom: 20px;
      }
      label {
        font-size: 14px;
        margin-bottom: 5px;
        display: block;
        margin-top: 15px;
      }
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        background-color: white;
      }
      select:disabled {
        background-color: #e9ecef;
      }
      .ok {
        font-size: 15px;
        margin-top: 20px;
        font-weight: bold;
        color: #333;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Dropdown Dinamis</h2>

      <label>Provinsi:</label>
      <select id="prov">
        <option value="">-- Pilih Provinsi --</option>
      </select>

      <label>Kota / Kabupaten:</label>
      <select id="kota" disabled>
        <option value="">-- Pilih Kota --</option>
      </select>

      <div class="ok" id="out"></div>
    </div>
    <script src="latihan4-dropdown-dinamis.js"></script>
  </body>
</html>
